<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Der Senfname-Generator 🟡</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --senf: #e6b800;
      --senf-dark: #b8860b;
      --senf-light: #fff3a3;
      --senf-deep: #8B6914;
      --glas: #f5e642;
      --bg: #1a1200;
      --text: #fff8e1;
      --accent: #ff6b00;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== SENF-BLOBS HINTERGRUND ===== */
    .blob-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, var(--senf) 0%, transparent 70%);
      opacity: 0.07;
      animation: blobFloat linear infinite;
    }

    @keyframes blobFloat {
      0%   { transform: translateY(110vh) scale(0.8) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.07; }
      90%  { opacity: 0.07; }
      100% { transform: translateY(-20vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    /* ===== SENF-TROPFEN REGEN ===== */
    .drip-container {
      position: fixed;
      top: 0; left: 0; right: 0;
      pointer-events: none;
      z-index: 1;
    }

    .drip {
      position: absolute;
      top: -60px;
      width: 12px;
      height: 60px;
      background: linear-gradient(to bottom, var(--senf), var(--senf-dark));
      border-radius: 0 0 50% 50%;
      animation: dripFall linear infinite;
      opacity: 0.4;
    }

    .drip::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 14px;
      background: var(--senf);
      border-radius: 50%;
    }

    @keyframes dripFall {
      0%   { transform: translateY(0); opacity: 0; }
      10%  { opacity: 0.4; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

    /* ===== SENF-PARTIKEL ===== */
    .particle-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ===== MAIN LAYOUT ===== */
    main {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ===== HEADER ===== */
    .hero {
      text-align: center;
      margin-bottom: 50px;
    }

    .jar-emoji {
      font-size: 5rem;
      display: block;
      animation: jarWobble 2s ease-in-out infinite;
      filter: drop-shadow(0 0 20px var(--senf));
    }

    @keyframes jarWobble {
      0%, 100% { transform: rotate(-5deg) scale(1); }
      50%       { transform: rotate(5deg) scale(1.08); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      color: var(--senf);
      text-shadow: 0 0 40px var(--senf-dark), 3px 3px 0 var(--senf-deep);
      line-height: 1.1;
      margin: 10px 0;
      animation: titlePulse 3s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { text-shadow: 0 0 40px var(--senf-dark), 3px 3px 0 var(--senf-deep); }
      50%       { text-shadow: 0 0 70px var(--glas), 3px 3px 0 var(--senf-deep), 0 0 100px var(--senf); }
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--senf-light);
      opacity: 0.8;
      margin-top: 8px;
      font-style: italic;
    }

    /* ===== SENF-WELLE DEKORATION ===== */
    .wave-divider {
      width: 100%;
      max-width: 600px;
      height: 20px;
      background: repeating-linear-gradient(
        90deg,
        var(--senf) 0px, var(--senf) 10px,
        var(--senf-dark) 10px, var(--senf-dark) 20px
      );
      border-radius: 10px;
      margin: 20px auto;
      animation: waveSlide 2s linear infinite;
      background-size: 40px 100%;
    }

    @keyframes waveSlide {
      from { background-position: 0 0; }
      to   { background-position: 40px 0; }
    }

    /* ===== CARD ===== */
    .card {
      background: linear-gradient(135deg, #2a1f00 0%, #1a1200 60%, #221800 100%);
      border: 2px solid var(--senf-dark);
      border-radius: 24px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 0 60px rgba(230,184,0,0.15), inset 0 1px 0 rgba(230,184,0,0.1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; height: 4px;
      background: linear-gradient(90deg, transparent, var(--senf), transparent);
      animation: borderGlow 3s ease-in-out infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    /* ===== INPUT ===== */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    label {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1.2rem;
      color: var(--senf);
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      background: rgba(255,243,163,0.07);
      border: 2px solid var(--senf-dark);
      border-radius: 14px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 16px 20px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      width: 100%;
    }

    input[type="text"]:focus {
      border-color: var(--senf);
      box-shadow: 0 0 20px rgba(230,184,0,0.3);
    }

    input[type="text"]::placeholder {
      color: rgba(255,248,225,0.3);
      font-weight: 400;
    }

    /* ===== BUTTON ===== */
    .senf-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--senf) 0%, var(--senf-dark) 100%);
      border: none;
      border-radius: 14px;
      color: var(--bg);
      cursor: pointer;
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.3s;
      box-shadow: 0 4px 20px rgba(230,184,0,0.4);
    }

    .senf-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    .senf-btn:hover::before { transform: translateX(100%); }

    .senf-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(230,184,0,0.6);
    }

    .senf-btn:active { transform: translateY(0); }

    /* ===== RESULT SECTION ===== */
    .result-section {
      display: none;
      margin-top: 30px;
      text-align: center;
      animation: resultAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .result-section.visible { display: block; }

    @keyframes resultAppear {
      from { opacity: 0; transform: scale(0.7) rotate(-5deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .result-label {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1rem;
      color: var(--senf-light);
      opacity: 0.7;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .result-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      font-weight: 900;
      color: var(--senf);
      text-shadow: 0 0 30px rgba(230,184,0,0.5);
      word-break: break-word;
      line-height: 1.2;
    }

    .result-emoji {
      font-size: 3rem;
      display: block;
      margin: 12px 0;
      animation: emojiSpin 1s ease-out;
    }

    @keyframes emojiSpin {
      from { transform: rotate(-360deg) scale(0); }
      to   { transform: rotate(0deg) scale(1); }
    }

    .result-description {
      margin-top: 14px;
      font-size: 0.95rem;
      color: var(--senf-light);
      opacity: 0.75;
      line-height: 1.6;
      font-style: italic;
    }

    .result-score {
      display: inline-block;
      margin-top: 16px;
      background: rgba(230,184,0,0.15);
      border: 1px solid var(--senf-dark);
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 0.85rem;
      color: var(--senf);
      font-weight: 700;
    }

    /* ===== SENF-ZITAT BEREICH ===== */
    .senf-facts {
      margin-top: 50px;
      max-width: 520px;
      width: 100%;
    }

    .fact-title {
      font-family: 'Fredoka One', sans-serif;
      font-size: 1rem;
      color: var(--senf-dark);
      text-align: center;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .fact-scroll {
      display: flex;
      gap: 16px;
      overflow: hidden;
      position: relative;
    }

    .fact-scroll::before, .fact-scroll::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 40px;
      z-index: 2;
      pointer-events: none;
    }
    .fact-scroll::before { left: 0; background: linear-gradient(to right, var(--bg), transparent); }
    .fact-scroll::after  { right: 0; background: linear-gradient(to left, var(--bg), transparent); }

    .fact-track {
      display: flex;
      gap: 16px;
      animation: scrollFacts 30s linear infinite;
      white-space: nowrap;
    }

    @keyframes scrollFacts {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .fact-pill {
      background: rgba(230,184,0,0.1);
      border: 1px solid rgba(230,184,0,0.25);
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 0.82rem;
      color: var(--senf-light);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ===== SENFKORN REGEN ===== */
    .mustard-seed {
      position: fixed;
      width: 6px;
      height: 6px;
      background: var(--senf);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      animation: seedFall linear forwards;
    }

    @keyframes seedFall {
      0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ===== CELEBRATIONSPLASH ===== */
    .splash {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      font-size: 2rem;
      animation: splashPop 1.2s ease-out forwards;
    }

    @keyframes splashPop {
      0%   { transform: scale(0) translateY(0); opacity: 1; }
      60%  { transform: scale(1.3) translateY(-80px); opacity: 1; }
      100% { transform: scale(0.8) translateY(-150px); opacity: 0; }
    }

    /* ===== FOOTER ===== */
    footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: rgba(230,184,0,0.3);
    }

    /* ===== SENF-WELLE BOTTOM ===== */
    .bottom-wave {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to top, rgba(230,184,0,0.05), transparent);
      pointer-events: none;
      z-index: 2;
    }

    /* Sticky Senftropfen an den Seiten */
    .side-drip {
      position: fixed;
      top: 0;
      width: 20px;
      pointer-events: none;
      z-index: 3;
    }
    .side-drip.left  { left: 10px; }
    .side-drip.right { right: 10px; }

    .side-drip-drop {
      width: 18px;
      background: linear-gradient(to bottom, var(--senf), var(--senf-dark));
      border-radius: 0 0 50% 50%;
      animation: sideDripAnim ease-in-out infinite;
      margin: 0 auto;
    }

    @keyframes sideDripAnim {
      0%, 100% { height: 40px; transform: translateY(0); }
      50%       { height: 70px; transform: translateY(10px); }
    }

  </style>
</head>
<body>

  <!-- Hintergrund Blobs -->
  <div class="blob-container" id="blobContainer"></div>

  <!-- Senfttropfen-Regen von oben -->
  <div class="drip-container" id="dripContainer"></div>

  <!-- Canvas für Partikel -->
  <canvas class="particle-canvas" id="particleCanvas"></canvas>

  <!-- Seiten-Tropfen -->
  <div class="side-drip left">
    <div class="side-drip-drop" style="animation-duration: 2.1s; animation-delay: 0s;"></div>
    <div class="side-drip-drop" style="animation-duration: 3.4s; animation-delay: 0.8s; height: 30px;"></div>
  </div>
  <div class="side-drip right">
    <div class="side-drip-drop" style="animation-duration: 2.7s; animation-delay: 0.5s;"></div>
    <div class="side-drip-drop" style="animation-duration: 1.9s; animation-delay: 1.2s; height: 25px;"></div>
  </div>

  <div class="bottom-wave"></div>

  <main>

    <div class="hero">
      <span class="jar-emoji">🟡</span>
      <h1>Der Senfname-Generator</h1>
      <p class="tagline">Entdecke deinen wahren, senfdurchtränkten Nachnamen</p>
    </div>

    <div class="wave-divider"></div>

    <div class="card">
      <div class="input-group">
        <label for="nameInput">🧂 Dein Vorname</label>
        <input
          type="text"
          id="nameInput"
          placeholder="z.B. Klaus, Brunhilde, Thorsten…"
          maxlength="40"
          autocomplete="off"
        />
      </div>

      <button class="senf-btn" onclick="generateSenfname()">
        🟡 Senf-Nachnamen enthüllen!
      </button>

      <div class="result-section" id="resultSection">
        <div class="wave-divider" style="margin: 20px auto;"></div>
        <div class="result-label">Dein offizieller Senfname lautet</div>
        <div class="result-name" id="resultName"></div>
        <span class="result-emoji" id="resultEmoji"></span>
        <div class="result-description" id="resultDescription"></div>
        <div class="result-score" id="resultScore"></div>
      </div>
    </div>

    <div class="senf-facts">
      <div class="fact-title">🌱 Senfweisheiten</div>
      <div class="fact-scroll">
        <div class="fact-track" id="factTrack">
          <!-- wird per JS befüllt -->
        </div>
      </div>
    </div>

  </main>

  <footer>
    Powered by 100% reinem Dijon-Algorithmus • Kein künstlicher Ketchup enthalten
  </footer>

  <script>
    // ===== DATEN =====
    const senfNachnamePräfixe = [
      "Senfkorn", "Mostrich", "Dijon", "Düsseldorfer", "Bayerisch",
      "Scharf", "Mittelscharf", "Süß", "Grobkörnig", "Feinkörnig",
      "Tafel", "Kremser", "Senftenberg", "Gelbwurz", "Kurkuma",
      "Körner", "Paste", "Würzig", "Pikant", "Aromatisch"
    ];

    const senfNachnameSuffixe = [
      "haufen", "berg", "stein", "mann", "meister", "könig", "baron",
      "schmied", "bauer", "müller", "fischer", "huber", "wolf",
      "brauer", "macher", "knecht", "schwert", "grund", "tal", "feld"
    ];

    const senfAdjektive = [
      "senfdurchtränkt", "mostrichlastig", "gelblich-würzig", "scharf-aromatisch",
      "dijonesque", "tubengepresst", "körnerreich", "senfbestückt"
    ];

    const senfBeschreibungen = [
      (name) => `${name} verbreitet überall einen charakteristischen Duft nach frisch geöffneter Senfpackung. Menschen in seiner Nähe fragen sich immer: "Riecht hier jemand nach Würstchen?"`,
      (name) => `Wo ${name} geht, hinterlässt er/sie eine zarte gelbe Spur. Zufällig oder Schicksal? Wir tippen auf Schicksal.`,
      (name) => `${name} hat das seltene Talent, jedes Gericht mit einem einzigen Blick "senfiger" zu machen. Die Wissenschaft ist ratlos.`,
      (name) => `Historiker behaupten, ein Vorfahre von ${name} hat die Erfindung des Senfglases maßgeblich vorangetrieben. Unbewiesen, aber plausibel.`,
      (name) => `${name} kann 47 Senfsorten allein am Geruch unterscheiden. Das ist zwar nutzlos, aber beeindruckend.`,
      (name) => `Wenn ${name} einen Raum betritt, strahlen alle Senfgläser in einem Radius von 3 Metern etwas heller.`,
      (name) => `${name} träumt jede Nacht vom perfekten Senf-Sandwich. Bisher hat er/sie es noch nicht in der Realität erreicht, aber die Hoffnung lebt.`,
      (name) => `Eine seltene Eigenschaft von ${name}: Bei Kälte wird er/sie etwas schärfer. Wie echter Senf. Zufall? Wohl kaum.`,
    ];

    const senfEmojis = ["🟡", "🌭", "🥨", "🧂", "🫙", "✨", "🌟", "💛", "🏆", "👑"];

    const senfStufen = [
      { label: "Mild-Senf-Potenzial", range: [0, 25] },
      { label: "Mittelscharf-Charakter", range: [25, 50] },
      { label: "Echter Dijon-Geist", range: [50, 75] },
      { label: "EXTRA SCHARF – Vollsenf!", range: [75, 100] },
    ];

    const senfFakten = [
      "🌱 Senfkörner sind die älteste gewürzte Sauce der Welt",
      "🟡 Dijon-Senf enthält keinen einzigen Senf aus Dijon",
      "🧂 Der Name 'Senf' kommt vom Lateinischen 'sinapis'",
      "🫙 Pro Jahr werden in Deutschland 80.000 Tonnen Senf verzehrt",
      "🌭 Hotdog ohne Senf ist statistisch gesehen nur ein Brot",
      "💛 Gelb ist die Farbe der Weisheit – deshalb ist Senf gelb",
      "🔬 Senf ist eines der wenigen Nahrungsmittel, das nie schlecht wird",
      "🏺 Im alten Ägypten wurde Senf als Zahlungsmittel verwendet",
      "🌡️ Schärfe im Senf entsteht erst beim Kontakt mit Wasser",
      "🎨 Senf war eine der ersten gelben Malerfarben Europas",
      "🐝 Senf-Blüten sind ein Paradies für Bienen",
      "🥄 Ein Esslöffel Senf hat nur 9 Kalorien – der Unschuldige!",
    ];

    // ===== NAME GENERIERUNG =====
    function generateSenfname() {
      const input = document.getElementById('nameInput').value.trim();
      if (!input) {
        shakeInput();
        return;
      }

      const vorname = input.charAt(0).toUpperCase() + input.slice(1).toLowerCase();

      // Deterministischer Hash vom Namen
      let hash = 0;
      for (let i = 0; i < vorname.length; i++) {
        hash = (hash * 31 + vorname.charCodeAt(i)) & 0xffffffff;
      }
      const absHash = Math.abs(hash);

      const präfix = senfNachnamePräfixe[absHash % senfNachnamePräfixe.length];
      const suffix = senfNachnameSuffixe[(absHash >> 4) % senfNachnameSuffixe.length];
      const nachname = präfix + suffix;
      const emoji = senfEmojis[(absHash >> 8) % senfEmojis.length];
      const beschreibung = senfBeschreibungen[(absHash >> 3) % senfBeschreibungen.length](vorname);

      // Senfwert 0–100
      const senfwert = absHash % 100;
      const stufe = senfStufen.find(s => senfwert >= s.range[0] && senfwert < s.range[1]) || senfStufen[3];

      // Ergebnis anzeigen
      const section = document.getElementById('resultSection');
      document.getElementById('resultName').textContent = `${vorname} ${nachname}`;
      document.getElementById('resultEmoji').textContent = emoji;
      document.getElementById('resultDescription').textContent = beschreibung;
      document.getElementById('resultScore').textContent = `Senf-Level ${senfwert}/100 · ${stufe.label}`;

      section.classList.remove('visible');
      void section.offsetWidth; // reflow für Animation
      section.classList.add('visible');

      // Celebrationseffekte!
      launchCelebration();
      spawnMustardSeeds(20);
    }

    function shakeInput() {
      const input = document.getElementById('nameInput');
      input.style.animation = 'none';
      input.style.borderColor = 'var(--accent)';
      input.style.boxShadow = '0 0 20px rgba(255,107,0,0.5)';
      input.style.transform = 'translateX(-5px)';
      setTimeout(() => input.style.transform = 'translateX(5px)', 80);
      setTimeout(() => input.style.transform = 'translateX(-3px)', 160);
      setTimeout(() => input.style.transform = 'translateX(3px)', 240);
      setTimeout(() => {
        input.style.transform = '';
        input.style.borderColor = '';
        input.style.boxShadow = '';
        input.placeholder = "Gib erst einen Namen ein! 🟡";
      }, 320);
    }

    // Enter-Taste
    document.getElementById('nameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') generateSenfname();
    });

    // ===== CELEBRATION =====
    function launchCelebration() {
      const emojis = ["🟡", "🌭", "🥨", "💛", "✨", "🫙"];
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          const splash = document.createElement('div');
          splash.className = 'splash';
          splash.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          splash.style.left = (Math.random() * 80 + 10) + 'vw';
          splash.style.top = (Math.random() * 50 + 25) + 'vh';
          document.body.appendChild(splash);
          setTimeout(() => splash.remove(), 1300);
        }, i * 80);
      }
    }

    // ===== SENFKORN-REGEN =====
    function spawnMustardSeeds(count) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const seed = document.createElement('div');
          seed.className = 'mustard-seed';
          seed.style.left = Math.random() * 100 + 'vw';
          seed.style.top = '-10px';
          seed.style.width = (4 + Math.random() * 6) + 'px';
          seed.style.height = (4 + Math.random() * 6) + 'px';
          seed.style.animationDuration = (2 + Math.random() * 4) + 's';
          seed.style.opacity = 0.4 + Math.random() * 0.5;
          document.body.appendChild(seed);
          setTimeout(() => seed.remove(), 6000);
        }, i * 60);
      }
    }

    // ===== HINTERGRUND BLOBS =====
    function createBlobs() {
      const container = document.getElementById('blobContainer');
      for (let i = 0; i < 8; i++) {
        const blob = document.createElement('div');
        blob.className = 'blob';
        const size = 100 + Math.random() * 300;
        blob.style.width = size + 'px';
        blob.style.height = size + 'px';
        blob.style.left = Math.random() * 100 + 'vw';
        blob.style.animationDuration = (15 + Math.random() * 25) + 's';
        blob.style.animationDelay = -(Math.random() * 30) + 's';
        container.appendChild(blob);
      }
    }

    // ===== SENF-TROPFEN REGEN =====
    function createDrips() {
      const container = document.getElementById('dripContainer');
      for (let i = 0; i < 12; i++) {
        const drip = document.createElement('div');
        drip.className = 'drip';
        drip.style.left = (Math.random() * 100) + 'vw';
        drip.style.width = (6 + Math.random() * 10) + 'px';
        drip.style.animationDuration = (5 + Math.random() * 12) + 's';
        drip.style.animationDelay = -(Math.random() * 15) + 's';
        drip.style.opacity = 0.15 + Math.random() * 0.2;
        container.appendChild(drip);
      }
    }

    // ===== CANVAS PARTIKEL =====
    function initParticles() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      const particles = [];
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 1.5 + Math.random() * 3,
          dx: (Math.random() - 0.5) * 0.4,
          dy: -0.1 - Math.random() * 0.3,
          alpha: 0.1 + Math.random() * 0.3,
          hue: 40 + Math.random() * 20,
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${p.alpha})`;
          ctx.fill();

          p.x += p.dx;
          p.y += p.dy;

          if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    // ===== FAKTEN BAND =====
    function buildFactBand() {
      const track = document.getElementById('factTrack');
      const allFacts = [...senfFakten, ...senfFakten]; // doppelt für Loop
      allFacts.forEach(f => {
        const pill = document.createElement('div');
        pill.className = 'fact-pill';
        pill.textContent = f;
        track.appendChild(pill);
      });
    }

    // ===== INIT =====
    createBlobs();
    createDrips();
    initParticles();
    buildFactBand();
  </script>

</body>
</html>
